# Crassostrea gateway
d /var/lib/crassostrea 0755 root root -
# Requests of the web UI to root services (set-hostname, tls-apply, network-apply, backup)
d /var/lib/crassostrea/web 0750 crassostrea crassostrea -
# Outcome of those requests, read by the web UI (tls-apply, network-apply)
d /var/lib/crassostrea/tls 0755 root root -
d /var/lib/crassostrea/network 0755 root root -
# Cluster node state (system/libexec/cluster-node), read by cluster-report
d /var/lib/crassostrea/cluster 0755 root root -
# Join bundles a member writes for joining nodes; the web UI hands them out
# and deletes them (cluster-node, services/cluster.py)
d /var/lib/crassostrea/cluster-bundles 0770 root crassostrea -
# Outcome of creating or joining a cluster (system/libexec/cluster-setup)
d /var/lib/crassostrea/cluster-setup 0755 root root -
# Backups (system/libexec/backup): readable by the web UI for downloads
d /var/lib/crassostrea/backups 0750 root crassostrea -
d /run/clamd.crassostrea 0710 clamscan virusgroup -
