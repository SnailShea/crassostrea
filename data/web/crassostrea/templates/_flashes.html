{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flashes">
  {% for category, message in messages %}
  <div class="alert {{ category if category in ('success', 'warning', 'danger', 'info') else 'info' }}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
{% endwith %}
