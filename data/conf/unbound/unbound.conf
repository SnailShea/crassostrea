# Installed as /etc/unbound/conf.d/crassostrea.conf.
# The stock /etc/unbound/unbound.conf of EL10 listens on localhost only,
# validates DNSSEC (trust anchor maintained by unbound-anchor) and enables
# unbound-control; these are the gateway's additions. Rspamd, Postfix and
# postfix-tlspol use this resolver directly (127.0.0.1:53): DNS blocklists
# refuse queries from public resolvers.
server:
  cache-min-ttl: 5
  cache-max-negative-ttl: 60
  hide-identity: yes
  hide-version: yes
  max-udp-size: 4096
  msg-buffer-size: 65552
  unwanted-reply-threshold: 10000
  ipsecmod-enabled: no
