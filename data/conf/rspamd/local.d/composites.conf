MX_IMPLICIT {
  expression = "MX_GOOD & MX_MISSING";
  score = -0.01;
}
# Viruses are always rejected, even when every allow list matches
# (IP + envelope sender + header sender = -6150)
VIRUS_FOUND {
  expression = "CLAM_VIRUS";
  score = 10000.0;
}
# Bad policy from free mail providers
FREEMAIL_POLICY_FAILURE {
  expression = "FREEMAIL_FROM & !DMARC_POLICY_ALLOW & !MAILLIST & -g+:policies";
  score = 16.0;
}
# Applies to freemail with undisclosed recipients
FREEMAIL_TO_UNDISC_RCPT {
  expression = "FREEMAIL_FROM & ( MISSING_TO | R_UNDISC_RCPT | TO_EQ_FROM )";
  score = 5.0;
}
# Allow-list entries do not apply to senders failing their own DMARC/SPF
# policy - the allow-listed address was most likely spoofed. Soft failures
# count too (SPF ~all, DMARC p=none): otherwise every sender whose domain
# does not enforce its policy could be impersonated to skip scoring.
DOMAIN_ALLOWLIST_EXCLUDE {
  expression = "^DOMAIN_ALLOWLIST & (-DMARC_POLICY_REJECT | -DMARC_POLICY_QUARANTINE | -DMARC_POLICY_SOFTFAIL | -R_SPF_PERMFAIL | -R_SPF_FAIL | -R_SPF_SOFTFAIL)";
}
GLOBAL_SMTP_FROM_WL_EXCLUDE {
  expression = "^GLOBAL_SMTP_FROM_WL & (-DMARC_POLICY_REJECT | -DMARC_POLICY_QUARANTINE | -DMARC_POLICY_SOFTFAIL | -R_SPF_PERMFAIL | -R_SPF_FAIL | -R_SPF_SOFTFAIL)";
}
GLOBAL_MIME_FROM_WL_EXCLUDE {
  expression = "^GLOBAL_MIME_FROM_WL & (-DMARC_POLICY_REJECT | -DMARC_POLICY_QUARANTINE | -DMARC_POLICY_SOFTFAIL | -R_SPF_PERMFAIL | -R_SPF_FAIL | -R_SPF_SOFTFAIL)";
}
# Mail from the internet claiming to come from a protected domain while
# failing its policies (excluding relay networks and allow-listed senders)
SPOOFED_PROTECTED_DOMAIN {
  expression = "!RELAY_NETWORK & !DOMAIN_ALLOWLIST & !RSPAMD_HOST & PROTECTED_DOMAIN_HEADER_FROM & -g+:policies";
  score = 50.0;
}
# Only apply to inbound mail from the internet that is not allow-listed
OLEFY_MACRO {
  expression = "!RELAY_NETWORK & !DOMAIN_ALLOWLIST & OLETOOLS";
  score = 20.0;
  policy = "remove_weight";
}
# Applies to a content filter map
BAD_WORD_BAD_TLD {
  expression = "FISHY_TLD & ( BAD_WORDS | BAD_WORDS_DE )";
  score = 10.0;
}
# Forged with bad policies, keep bad policy symbols
FORGED_W_BAD_POLICY {
  expression = "( -g+:policies | -R_SPF_NA) & ( ~FROM_NEQ_ENVFROM | ~FORGED_SENDER ) & !DMARC_POLICY_ALLOW";
  score = 3.0;
}
# Remove fuzzy group from bounces
BOUNCE_FUZZY {
  expression = "-BOUNCE & ^g+:fuzzy";
}
# Remove bayes ham if fuzzy denied
FUZZY_HAM_MISMATCH {
  expression = "( -FUZZY_DENIED | -CRASSOSTREA_FUZZY_DENIED | -LOCAL_FUZZY_DENIED ) & ( ^BAYES_HAM | ^NEURAL_HAM_LONG | ^NEURAL_HAM_SHORT )";
}
# Remove bayes spam if local fuzzy white
FUZZY_SPAM_MISMATCH {
  expression = "( -LOCAL_FUZZY_WHITE ) & ( ^BAYES_SPAM | ^NEURAL_SPAM_LONG | ^NEURAL_SPAM_SHORT )";
}

CLAMD_SPAM_FOUND {
  expression = "CLAM_SECI_SPAM & !DOMAIN_ALLOWLIST";
  description = "Probably Spam, Securite Spam Flag set through ClamAV";
  score = 5;
}

CLAMD_BAD_PDF {
