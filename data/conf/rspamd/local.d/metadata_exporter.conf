# Messages exported to the web UI (crassostrea-web-internal, bound to
# loopback):
#  - every message for a protected domain or from a relay network to the
#    mail log
#  - rejected inbound mail for protected domains and rejected outbound mail
#    from relay networks to the quarantine
rules {
  MAILLOG {
    backend = "http";
    url = "http://127.0.0.1:8001/internal/mail-log";
    selector = "protected_or_relayed";
    formatter = "multipart";
    # large messages take a while to store; below options.inc's task_timeout,
    # which soft-rejects the message when it expires
    timeout = 10s;
  }
  QUARANTINE {
    backend = "http";
    url = "http://127.0.0.1:8001/internal/quarantine";
    selector = "reject_no_blocklist";
    formatter = "multipart";
    timeout = 10s;
  }
}

custom_select {
  protected_or_relayed = <<EOD
return function(task)
  -- inbound mail for protected domains, or outbound mail from relay
  -- networks (the web UI tells them apart by the RELAY_NETWORK symbol)
  return task:has_symbol('RCPT_PROTECTED_DOMAIN') or task:has_symbol('RELAY_NETWORK')
end
EOD;
  reject_no_blocklist = <<EOD
return function(task)
  -- Mail rejected by an explicit block list entry is not worth keeping
  if task:has_symbol('GLOBAL_SMTP_FROM_BL')
    or task:has_symbol('GLOBAL_MIME_FROM_BL')
    or task:has_symbol('IP_BLOCKLIST')
    or task:has_symbol('LOCAL_BL_ASN')
    or task:has_symbol('BAD_SUBJECT_00')
    or task:has_symbol('DOMAIN_BLOCKLIST') then
    return false
  end
  if not task:has_symbol('RCPT_PROTECTED_DOMAIN') and not task:has_symbol('RELAY_NETWORK') then
    return false
  end
  local action = task:get_metric_action('default')
  return action == 'reject'
end
EOD;
}
