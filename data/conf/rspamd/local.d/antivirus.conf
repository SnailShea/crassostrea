clamav {
  # Scan whole message
  scan_mime_parts = false;
  #scan_text_mime = true;
  #scan_image_mime = true;
  symbol = "CLAM_VIRUS";
  type = "clamav";
  log_clean = true;
  servers = "127.0.0.1:3310";
  # Every message Rspamd scans (options.inc max_message, the web UI's message
  # size limit is at most 100 MiB); clamd's StreamMaxLength matches
  max_size = 134217728;
  # Large messages and archives take a while: clamd stops after MaxScanTime
  # (90 s) and reports it. A timed-out scan is not retried, that would scan
  # the message again from the start. worker-normal.inc's task_timeout
  # leaves room for it.
  timeout = 100;
  retransmits = 0;
  # Content clamd could not scan completely (clamd.conf AlertExceedsMax: an
  # archive or a scan beyond its limits) is not a virus, but must not pass
  # unnoticed either (score in groups.conf)
  patterns {
    CLAM_SCAN_INCOMPLETE = "^Heuristics\\.Limits\\.Exceeded";
  }
}
