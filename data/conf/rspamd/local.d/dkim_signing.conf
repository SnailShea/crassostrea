# Outbound DKIM signing. Keys are managed in the web UI (Domains -> DKIM
# signing) and copied to redis by the web UI.
#
# Only mail from the relay networks (web UI -> Settings) is signed, with the
# key of the domain in the From header. Inbound mail is never signed.
enabled = true;
use_redis = true;
key_prefix = "DKIM_PRIV_KEYS";
selector_prefix = "DKIM_SELECTORS";
try_fallback = false;

use_domain = "header";
use_esld = false;
allow_hdrfrom_mismatch = true;
allow_hdrfrom_multiple = false;
allow_username_mismatch = true;
allow_envfrom_empty = true;

sign_authenticated = false;
sign_local = false;
sign_inbound = false;
sign_networks = "/etc/rspamd/custom/relay_networks.map";

# (o) = oversign: signed once more than present so the header cannot be added
#       later without breaking the signature (e.g. a second From)
# (x) = oversign only if present
# Keep in sync with SIGN_HEADERS in data/web/crassostrea/services/dkim.py, which
# signs released outbound quarantine mail.
sign_headers = "(o)from:(x)sender:(o)reply-to:(o)subject:(x)date:(x)message-id:(o)to:(o)cc:(x)mime-version:(x)content-type:(x)content-transfer-encoding:resent-to:resent-cc:resent-from:resent-sender:resent-message-id:(x)in-reply-to:(x)references:list-id:list-help:list-owner:list-unsubscribe:list-unsubscribe-post:list-subscribe:list-post:(x)openpgp:(x)autocrypt";
