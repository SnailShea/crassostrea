#UpdateLogFile /dev/console
# Installed as /etc/freshclam.conf (clamav-freshclam.service runs it with -d --foreground)
LogTime yes
LogSyslog yes
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamupdate
DNSDatabaseInfo current.cvd.clamav.net
DatabaseMirror db.uk.clamav.net
DatabaseMirror db.nl.clamav.net
DatabaseMirror db.fr.clamav.net
DatabaseMirror db.ch.clamav.net
MaxAttempts 4
ScriptedUpdates yes
Checks 6
NotifyClamd /etc/clamd.d/crassostrea.conf
ConnectTimeout 20
ReceiveTimeout 20
TestDatabases yes
Bytecode yes

