#Debug true
#LogFile /dev/null
# Installed as /etc/clamd.d/crassostrea.conf (clamd@crassostrea.service)
LogTime yes
LogSyslog yes
LogClean yes
ExtendedDetectionInfo yes
PidFile /run/clamd.crassostrea/clamd.pid
OfficialDatabaseOnly no
LocalSocket /run/clamd.crassostrea/clamd.sock
TCPSocket 3310
TCPAddr 127.0.0.1
DatabaseDirectory /var/lib/clamav
# Rspamd sends every message it scans, up to 128 MiB (antivirus.conf max_size)
StreamMaxLength 128M
MaxThreads 10
ReadTimeout 10
CommandReadTimeout 3
SendBufTimeout 200
MaxQueue 80
IdleTimeout 20
SelfCheck 3600
User clamscan
# clamd@.service is Type=forking
Foreground no
DetectPUA yes
# See https://github.com/vrtadmin/clamav-faq/blob/master/faq/faq-pua.md
#ExcludePUA NetTool
#ExcludePUA PWTool
#IncludePUA Spy
#IncludePUA Scanner
#IncludePUA RAT
HeuristicAlerts yes
ScanOLE2 yes
AlertOLE2Macros no
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanMail yes
PhishingSignatures no
PhishingScanURLs no
HeuristicScanPrecedence yes
ScanHTML yes
ScanArchive yes
# Limits of a scan: an attachment of a message at the web UI's size limit
# (at most 100 MiB) is scanned in full, archives up to ClamAV's default depth
# and number of files. MaxScanTime (ms) ends a scan before Rspamd stops
# waiting (antivirus.conf timeout = 100 s). What exceeds a limit is reported
# (AlertExceedsMax) as Heuristics.Limits.Exceeded.*, which Rspamd scores as
# CLAM_SCAN_INCOMPLETE instead of letting it pass unscanned.
MaxScanSize 400M
MaxFileSize 128M
MaxRecursion 17
MaxFiles 10000
MaxScanTime 90000
AlertExceedsMax yes
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeTimeout 1000
ConcurrentDatabaseReload no
